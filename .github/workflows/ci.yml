name: factory-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-integrity:
    name: factory/package-integrity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify package integrity
        run: |
          python scripts/verify_manifest.py
          python scripts/build_sbom.py --check
          python scripts/validate_package.py

  scope-guard:
    name: factory/scope-guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run scope and command policy tests
        run: python -m unittest tests.test_policy_guard -v

  quality:
    name: factory/quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install package and checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
      - name: Verify source manifest
        run: |
          python scripts/verify_manifest.py
          python scripts/build_sbom.py --check
      - name: Static package and secret gates
        run: |
          python scripts/validate_package.py
          python scripts/secret_scan.py
      - name: Tests and type gates
        run: |
          python -m pytest
          python -m unittest pilot.tests.test_pilot -v
          python -m compileall -q scripts tests factory pilot
          python -m ruff check factory scripts tests pilot
          python -m mypy factory scripts pilot

  security:
    name: factory/security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run secret scan
        run: python scripts/secret_scan.py

  independent-review:
    name: factory/independent-review
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run schema and runtime review fixtures
        run: python -m unittest tests.test_schemas tests.test_factory_runtime -v

  release-readiness:
    name: factory/release-readiness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run pilot and release checks
        run: |
          python -m unittest pilot.tests.test_pilot -v
          python -m compileall -q scripts tests factory pilot
          python scripts/verify_manifest.py
