services:
  pilot:
    build:
      context: .
    image: hermes-factory-pilot:0.1.0
    restart: unless-stopped
    environment:
      PILOT_HOST: 0.0.0.0
      PILOT_PORT: "8080"
      PILOT_DB: /data/pilot.db
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - pilot-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  pilot-data:
