version: "1.0"
gates:
  - id: package-integrity
    command: python3 scripts/validate_package.py
    allowlist_prefixes: ["python3 scripts/validate_package.py"]
    timeout_seconds: 120
    mandatory: true
  - id: unit-tests
    command: python3 -m unittest discover -s tests -v
    allowlist_prefixes: ["python3 -m unittest"]
    timeout_seconds: 300
    mandatory: true
  - id: python-compile
    command: python3 -m compileall -q scripts tests factory pilot
    allowlist_prefixes: ["python3 -m compileall"]
    timeout_seconds: 120
    mandatory: true
  - id: pilot-tests
    command: python3 -m unittest pilot.tests.test_pilot -v
    allowlist_prefixes: ["python3 -m unittest"]
    timeout_seconds: 300
    mandatory: true
  - id: lint
    command: python3 -m ruff check factory scripts tests pilot
    allowlist_prefixes: ["python3 -m ruff check"]
    timeout_seconds: 300
    mandatory: true
  - id: typecheck
    command: python3 -m mypy factory scripts pilot
    allowlist_prefixes: ["python3 -m mypy"]
    timeout_seconds: 300
    mandatory: true
  - id: secret-scan
    command: python3 scripts/secret_scan.py
    allowlist_prefixes: ["python3 scripts/secret_scan.py"]
    timeout_seconds: 120
    mandatory: true
  - id: manifest
    command: python3 scripts/verify_manifest.py
    allowlist_prefixes: ["python3 scripts/verify_manifest.py"]
    timeout_seconds: 120
    mandatory: true
  - id: sbom
    command: python3 scripts/build_sbom.py --check
    allowlist_prefixes: ["python3 scripts/build_sbom.py --check"]
    timeout_seconds: 120
    mandatory: true
  - id: target-environment
    command: python3 -m pip check
    allowlist_prefixes: ["python3 -m pip check"]
    timeout_seconds: 120
    mandatory: true
  - id: target-tests
    command: python3 -m pytest -q
    allowlist_prefixes: ["python3 -m pytest"]
    timeout_seconds: 900
    mandatory: true
  - id: target-compile
    command: python3 -m compileall -q src tests
    allowlist_prefixes: ["python3 -m compileall"]
    timeout_seconds: 180
    mandatory: true
  - id: target-lint
    command: python3 -m ruff check src tests
    allowlist_prefixes: ["python3 -m ruff check"]
    timeout_seconds: 300
    mandatory: false
  - id: target-sast
    adapter: target_changed_sast
    command: controller:target-changed-sast
    allowlist_prefixes: ["controller:target-changed-sast"]
    success_exit_codes: [0]
    timeout_seconds: 300
    mandatory: true
  - id: target-dependency-audit
    adapter: target_dependency_audit
    command: controller:target-dependency-audit
    allowlist_prefixes: ["controller:target-dependency-audit"]
    success_exit_codes: [0]
    timeout_seconds: 300
    mandatory: true
  - id: target-license-check
    adapter: target_license_check
    command: controller:target-license-check
    allowlist_prefixes: ["controller:target-license-check"]
    success_exit_codes: [0]
    timeout_seconds: 120
    mandatory: true
  - id: target-secret-scan
    adapter: target_changed_secret_scan
    command: controller:target-changed-secret-scan
    allowlist_prefixes: ["controller:target-changed-secret-scan"]
    success_exit_codes: [0]
    timeout_seconds: 120
    mandatory: true
