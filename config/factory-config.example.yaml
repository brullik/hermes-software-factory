version: "1.0"
controller:
  database_url: sqlite:////var/lib/hermes-factory/controller.db
  event_retention_days: 90
  transcript_retention_days: 14
  max_active_products: 2
  max_active_workers: 2
  reconcile_interval_seconds: 2
  capability_check_ttl_seconds: 300
  capability_retry_seconds: 15
  max_repair_cycles: 3
  agent_execution_timeout_seconds: 1800
  planning_execution_timeout_seconds: 900
  github_check_timeout_seconds: 300
  github_check_poll_seconds: 5
  observation_seconds: 1209600
paths:
  policies: /opt/hermes-factory/current/policies
  schemas: /opt/hermes-factory/current/schemas
  prompts: /opt/hermes-factory/current/prompts
  state: /var/lib/hermes-factory
  worktrees: /var/lib/hermes-factory/worktrees
  logs: /var/log/hermes-factory
github:
  owner: brullik
  factory_repository: hermes-software-factory
  governance:
    mode: single_owner
    owner_override_enabled: true
    owner_override_reason_required: true
    owner_override_reason: "Owner-authorized single-owner release mode for this installation"
    required_checks:
      - factory/quality
      - factory/security
      - factory/release-readiness
      - factory/scope-guard
    external_required_checks:
      - pm-acceptance
telegram:
  allowed_user_ids: []
  token_credential_name: telegram-token
intake:
  rate_limit_requests: 10
  rate_limit_window_seconds: 60
  max_idea_chars: 20000
  max_attachments: 16
network:
  admin_bind: 127.0.0.1
  admin_port: 8787
deployment:
  reverse_proxy: caddy
  current_vps_high_risk_production: false
  staging_root: /var/lib/hermes-factory/staging
  production_helper: /usr/local/sbin/hermes-factory-release-submit
  rollback_helper: /opt/hermes-factory/bin/factory-rollback
  health_probe_url: http://127.0.0.1:8787/healthz
  production_target:
    mode: current_vps
    host: current-vps.example.invalid
    install_root: /opt/hermes-factory
    entrypoint: scripts/deploy/promote-release.py
backup:
  tool: restic
  offsite_configured: false
  proof_path: /var/lib/hermes-factory/evidence/backup-latest.json
  max_proof_age_seconds: 129600
models:
  registry: /etc/hermes-factory/model-registry.yaml
  paid_api_fallback: false
