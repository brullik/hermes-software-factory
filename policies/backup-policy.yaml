version: "1.0"
policy_id: backup
tool: restic
encryption: mandatory
targets:
  - controller_database
  - kanban_state
  - product_databases
  - configuration_without_secret_values
  - release_manifests
schedule:
  controller_state: daily
  stateful_product_database: daily
  pre_deployment: mandatory
  pre_migration: mandatory
local_recovery:
  required: true
  proof_path: /var/lib/hermes-factory/evidence/backup-local-latest.json
  provider_failure_must_not_block_project_work: true
offsite:
  required_for_stateful_production: true
  provider: owner_selected_when_needed
  proof_path: /var/lib/hermes-factory/evidence/backup-latest.json
  retry_interval: 2h
  successful_proof_ttl: 26h
  missing_behavior:
    staging: allow
    production: block_with_owner_action
    independent_project_work: continue
verification:
  repository_check: weekly
  restore_drill: quarterly
  restore_drill_before_first_stateful_production: true
logs:
  store_data_contents: false
  store_digest_and_result_only: true
